parameters:
    app.version: '1.0.0'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Twig\AppExtension:
        arguments:
            $appVersion: '%app.version%'
