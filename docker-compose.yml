services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_REMOTE_PROJECT: ${INSTALL_REMOTE_PROJECT:-false}
        branch_project_name: ${branch_project_name:-main}
        git_project_account: ${git_project_account:-}
        git_project_account_secret: ${git_project_account_secret:-}
        project_env: ${project_env:-}
        git_project_repo_url: ${git_project_repo_url:-https://github.com/Ella-rep/homely.git}
    container_name: homely_app
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env.local
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - network1
    environment:
      APP_SECRET: ${APP_SECRET:-change_me_generate_with_openssl_rand_hex_32}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-homer}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-homer}
      DATABASE_NAME: ${DATABASE_NAME:-homely_db}
      DATABASE_VERSION: ${DATABASE_VERSION:-16.0.0}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-'^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'}
      
    volumes:
      - ./:/app:rw
      - ./vendor:/app/vendor
      - ./var:/app/var
    depends_on:
      database:
        condition: service_healthy

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:16-alpine
    container_name: homely_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-homer}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-homer}
      POSTGRES_DB: ${DATABASE_NAME:-homely_db}
    networks:
      - network1
    volumes:
      - ../homely_db:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-homer} -d ${DATABASE_NAME:-homely_db}"]
      interval: 5s
      timeout: 5s
      retries: 16

volumes:
  postgres_data:
    driver: local
  jwt_keys:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
    driver: local
    
networks:
  network1:
    name: reseau-projet
    external: true
